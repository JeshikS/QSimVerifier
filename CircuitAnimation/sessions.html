<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QASM Session Browser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .nav-buttons {
            padding: 20px 30px;
            border-bottom: 1px solid #eee;
        }

        .nav-btn {
            display: inline-block;
            padding: 12px 24px;
            margin-right: 10px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .nav-btn:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .sessions-grid {
            padding: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
        }

        .session-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .session-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .session-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .session-title {
            font-size: 1.4em;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .session-title::before {
            content: '🔬';
            margin-right: 10px;
            font-size: 1.2em;
        }

        .session-info {
            color: #666;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .session-files {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
        }

        .file-list {
            margin-top: 10px;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .file-name {
            color: #4facfe;
            font-weight: 500;
            text-decoration: none;
        }

        .file-name:hover {
            text-decoration: underline;
        }

        .file-size {
            color: #999;
            font-size: 0.9em;
        }

        .session-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .action-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            text-decoration: none;
            text-align: center;
            display: inline-block;
        }

        .btn-view {
            background: #4facfe;
            color: white;
        }

        .btn-view:hover {
            background: #3d8bfe;
        }

        .btn-download {
            background: #28a745;
            color: white;
        }

        .btn-download:hover {
            background: #218838;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        .btn-delete:hover {
            background: #c82333;
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: #666;
        }

        .empty-state h3 {
            font-size: 1.5em;
            margin-bottom: 15px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 6px;
            margin: 20px;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>QASM Session Browser</h1>
            <p>Browse and manage your quantum circuit analysis sessions</p>
        </div>

        <div class="nav-buttons">
            <a href="/" class="nav-btn">🏠 Upload New Circuit</a>
            <a href="#" class="nav-btn" onclick="refreshSessions()">🔄 Refresh</a>
            <a href="#" class="nav-btn" onclick="clearAllSessions()">🗑️ Clear All</a>
        </div>

        <div id="sessions-container">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading sessions...</p>
            </div>
        </div>
    </div>

    <script>
        let sessions = [];

        async function loadSessions() {
            try {
                const response = await fetch('/api/sessions');
                if (response.ok) {
                    sessions = await response.json();
                    renderSessions();
                } else {
                    showError('Failed to load sessions');
                }
            } catch (error) {
                showError('Error loading sessions: ' + error.message);
            }
        }

        function renderSessions() {
            const container = document.getElementById('sessions-container');
            
            if (sessions.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>No Sessions Found</h3>
                        <p>Upload a QASM file to create your first session</p>
                        <a href="/" class="nav-btn" style="margin-top: 20px;">Upload Circuit</a>
                    </div>
                `;
                return;
            }

            const sessionsHtml = sessions.map(session => `
                <div class="session-card">
                    <div class="session-title">${session.name}</div>
                    <div class="session-info">
                        <span>📅 ${formatDate(session.created)}</span>
                        <span>📁 ${session.files.length} files</span>
                    </div>
                    <div class="session-files">
                        <strong>Generated Files:</strong>
                        <div class="file-list">
                            ${session.files.map(file => `
                                <div class="file-item">
                                    <a href="${file.url}" class="file-name" target="_blank">${file.name}</a>
                                    <span class="file-size">${file.size}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <div class="session-actions">
                        <a href="/slideshow?session=${session.id}" class="action-btn btn-view">📊 View Slideshow</a>
                        <a href="/api/sessions/${session.id}/download" class="action-btn btn-download">💾 Download</a>
                        <button onclick="deleteSession('${session.id}')" class="action-btn btn-delete">🗑️ Delete</button>
                    </div>
                </div>
            `).join('');

            container.innerHTML = `<div class="sessions-grid">${sessionsHtml}</div>`;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
        }

        async function deleteSession(sessionId) {
            if (!confirm('Are you sure you want to delete this session?')) {
                return;
            }

            try {
                const response = await fetch(`/api/sessions/${sessionId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    loadSessions(); // Refresh the list
                } else {
                    showError('Failed to delete session');
                }
            } catch (error) {
                showError('Error deleting session: ' + error.message);
            }
        }

        async function clearAllSessions() {
            if (!confirm('Are you sure you want to delete ALL sessions? This cannot be undone.')) {
                return;
            }

            try {
                const response = await fetch('/api/sessions', {
                    method: 'DELETE'
                });

                if (response.ok) {
                    loadSessions(); // Refresh the list
                } else {
                    showError('Failed to clear sessions');
                }
            } catch (error) {
                showError('Error clearing sessions: ' + error.message);
            }
        }

        function refreshSessions() {
            document.getElementById('sessions-container').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading sessions...</p>
                </div>
            `;
            loadSessions();
        }

        function showError(message) {
            document.getElementById('sessions-container').innerHTML = `
                <div class="error">
                    <strong>Error:</strong> ${message}
                </div>
            `;
        }

        // Load sessions when page loads
        document.addEventListener('DOMContentLoaded', loadSessions);
    </script>
</body>
</html>
