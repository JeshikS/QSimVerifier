<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Circuit Results</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: white;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #00d4ff, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .nav-btn {
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            color: white;
            text-decoration: none;
            transition: all 0.3s;
            font-weight: 600;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .results-section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 1.8em;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .slideshow-embed {
            width: 100%;
            height: 800px;
            border: none;
            border-radius: 15px;
            background: white;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .download-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
        }

        .download-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .download-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s;
        }

        .download-card:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-5px);
        }

        .download-btn {
            display: inline-block;
            padding: 10px 20px;
            background: linear-gradient(45deg, #00d4ff, #009fff);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 10px;
            transition: all 0.3s;
            font-weight: 600;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.4);
        }

        .qasm-preview {
            background: #2c3e50;
            border-radius: 8px;
            padding: 15px;
            margin-top: 10px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            max-height: 200px;
            overflow-y: auto;
            text-align: left;
        }

        .loading {
            text-align: center;
            padding: 50px;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top: 5px solid #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: rgba(255, 0, 0, 0.2);
            border-left: 4px solid #ff0000;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            .nav-buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .slideshow-embed {
                height: 600px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 Quantum Circuit Results</h1>
            <p>Session: {{ session_id }}</p>
        </div>

        <div class="nav-buttons">
            <a href="/" class="nav-btn">🏠 New Circuit</a>
            <a href="#slideshow" class="nav-btn">🎥 View Animation</a>
            <a href="#downloads" class="nav-btn">📥 Downloads</a>
        </div>

        <div class="loading" id="loading">
            <div class="loading-spinner"></div>
            <p>Loading circuit results...</p>
        </div>

        <div id="results-content" style="display: none;">
            <div class="results-section" id="slideshow">
                <h2 class="section-title">🎬 Interactive Animation</h2>
                <iframe class="slideshow-embed" src="/outputs/session_{{ session_id }}/slideshow.html"></iframe>
            </div>

            <div class="results-section" id="downloads">
                <div class="download-section">
                    <h2 class="section-title">📥 Download Files</h2>
                    <div class="download-grid" id="download-grid">
                        <!-- Downloads will be populated by JavaScript -->
                    </div>
                </div>
            </div>
        </div>

        <div class="error" id="error" style="display: none;">
            <h3>❌ Error Loading Results</h3>
            <p id="error-message"></p>
        </div>
    </div>

    <script>
        const sessionId = '{{ session_id }}';

        async function loadResults() {
            try {
                // Check if slideshow exists
                const slideshowResponse = await fetch(`/outputs/session_${sessionId}/slideshow.html`);
                
                if (slideshowResponse.ok) {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('results-content').style.display = 'block';
                    
                    // Load download options
                    await loadDownloads();
                } else {
                    throw new Error('Slideshow not found');
                }
            } catch (error) {
                console.error('Error loading results:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error-message').textContent = 
                    'Failed to load circuit results. The session may have expired or the files may not have been generated yet.';
            }
        }

        async function loadDownloads() {
            const downloadGrid = document.getElementById('download-grid');
            
            // Common file types to look for
            const fileTypes = [
                { type: 'slideshow.html', name: 'Interactive Slideshow', icon: '🎬', description: 'Complete interactive animation' },
                { type: 'qasm', name: 'QASM Files', icon: '📝', description: 'Quantum circuit code files' }
            ];

            fileTypes.forEach(fileType => {
                if (fileType.type === 'qasm') {
                    // Add QASM files section
                    const qasmCard = document.createElement('div');
                    qasmCard.className = 'download-card';
                    qasmCard.innerHTML = `
                        <h3>${fileType.icon} ${fileType.name}</h3>
                        <p>${fileType.description}</p>
                        <div id="qasm-files"></div>
                    `;
                    downloadGrid.appendChild(qasmCard);
                    loadQasmFiles();
                } else {
                    // Add other file types
                    const card = document.createElement('div');
                    card.className = 'download-card';
                    card.innerHTML = `
                        <h3>${fileType.icon} ${fileType.name}</h3>
                        <p>${fileType.description}</p>
                        <a href="/outputs/session_${sessionId}/${fileType.type}" 
                           class="download-btn" target="_blank">
                           📥 Download
                        </a>
                    `;
                    downloadGrid.appendChild(card);
                }
            });
        }

        async function loadQasmFiles() {
            try {
                const response = await fetch(`/outputs/session_${sessionId}/qasm/`);
                const qasmContainer = document.getElementById('qasm-files');
                
                // Common QASM files that might exist
                const qasmFiles = [
                    'initial_circuit.qasm',
                    'broken_circuit.qasm',
                    'mutated_circuit_1.qasm',
                    'mutated_circuit_2.qasm',
                    'mutated_circuit_3.qasm',
                    'mutated_circuit_4.qasm',
                    'mutated_circuit_5.qasm'
                ];

                for (const filename of qasmFiles) {
                    try {
                        const fileResponse = await fetch(`/outputs/session_${sessionId}/qasm/${filename}`);
                        if (fileResponse.ok) {
                            const content = await fileResponse.text();
                            const qasmItem = document.createElement('div');
                            qasmItem.innerHTML = `
                                <h4>${filename}</h4>
                                <a href="/outputs/session_${sessionId}/qasm/${filename}" 
                                   class="download-btn" download>
                                   📥 Download
                                </a>
                                <div class="qasm-preview">${escapeHtml(content.substring(0, 500))}${content.length > 500 ? '...' : ''}</div>
                            `;
                            qasmContainer.appendChild(qasmItem);
                        }
                    } catch (e) {
                        // File doesn't exist, skip
                    }
                }

                if (qasmContainer.children.length === 0) {
                    qasmContainer.innerHTML = '<p>No QASM files generated</p>';
                }
            } catch (error) {
                console.error('Error loading QASM files:', error);
                document.getElementById('qasm-files').innerHTML = '<p>Error loading QASM files</p>';
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Smooth scrolling for anchor links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth' });
                }
            });
        });

        // Load results on page load
        loadResults();
    </script>
</body>
</html>
